[verification]
enabled = true
region_profile = "config/regions/bremerton-wa.json"
calibration_profile = "config/calibration/default.json"

[verification.rules]
reject_below = 0.40
verify_below = 0.95

[verification.consensus]
birdnet_weight = 1.0
verified_threshold = 0.90
probable_threshold = 0.70
rejected_threshold = 0.35

[verification.plugins]
geographic = true
seasonal = true
audio_quality = true
historical = true
second_model = false

# Optional process-isolated Perch runtime. The command must accept one JSON
# request on stdin and emit one JSON prediction on stdout.
[verification.perch]
command = ["python", "-m", "fieldmouse_perch_runtime"]
model_version = "perch-2.0-unconfigured"
timeout_seconds = 60
