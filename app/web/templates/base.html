<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#244a35"
    >

    <title>{% block title %}Project Field Mouse{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard-v2.css') }}"
    >

    {% block head %}{% endblock %}
</head>

<body>
    <div class="site-shell">
        <header class="site-header site-header-v3">
            <div class="pfm-cohesive-brand">
                <img
                    src="{{ url_for('static', filename='img/branding/project-field-mouse-cohesive-banner.png') }}"
                    alt="Project Field Mouse — Nature Connected"
                    width="1060"
                    height="218"
                >
            </div>

            <div class="site-header-status">
                {% block station_status %}{% endblock %}
            </div>
        </header>

        {% include "partials/navigation.html" %}

        <main class="page-content">
{% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            <span>Project Field Mouse</span>
            <span aria-hidden="true">·</span>
            <span>Nature Connected</span>
        </footer>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
